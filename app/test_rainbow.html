<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello PurpleAI!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #2d1b69 0%, #1a0a3e 40%, #0d001a 100%);
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        .rainbow-text {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow:
                0 0 20px rgba(255,255,255,0.3),
                0 0 40px rgba(255,255,255,0.15),
                0 0 80px rgba(138,43,226,0.4);
            background: linear-gradient(
                90deg,
                #ff0000, #ff7700, #ffff00,
                #00ff00, #0077ff, #8b00ff,
                #ff00ff
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-shift 2s linear infinite, pulse-glow 1.5s ease-in-out infinite alternate;
            cursor: default;
            user-select: none;
        }

        @keyframes rainbow-shift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes pulse-glow {
            0% {
                text-shadow:
                    0 0 20px rgba(255,255,255,0.2),
                    0 0 40px rgba(255,255,255,0.1),
                    0 0 80px rgba(138,43,226,0.3);
                transform: scale(1);
            }
            100% {
                text-shadow:
                    0 0 30px rgba(255,255,255,0.4),
                    0 0 60px rgba(255,255,255,0.2),
                    0 0 100px rgba(138,43,226,0.6),
                    0 0 140px rgba(75,0,130,0.4);
                transform: scale(1.05);
            }
        }

        /* 额外星星装饰 - 闪瞎眼！ */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255,255,255,0.6);
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        .sparkle:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; left: 80%; animation-delay: 0.3s; width: 3px; height: 3px; }
        .sparkle:nth-child(3) { top: 60%; left: 10%; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { top: 80%; left: 70%; animation-delay: 0.9s; width: 5px; height: 5px; }
        .sparkle:nth-child(5) { top: 15%; left: 50%; animation-delay: 1.2s; width: 2px; height: 2px; }
        .sparkle:nth-child(6) { top: 70%; left: 40%; animation-delay: 0.5s; }
        .sparkle:nth-child(7) { top: 45%; left: 90%; animation-delay: 1.5s; width: 3px; height: 3px; }
        .sparkle:nth-child(8) { top: 90%; left: 30%; animation-delay: 0.8s; }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- 闪烁星星 -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="rainbow-text">Hello PurpleAI!</div>
</body>
</html>
